<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>รายรับ-รายจ่าย</title>
    <!--ไฟล์CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="container">
    <h2>บัญชีรายรับ-รายจ่าย</h2>
<!--สรุปการเงิน -->
    <div class="summary-container">
        <div class="summary-box box-income">
            <h4>รายรับ</h4>
            <p id="total-income">฿0.00</p>
        </div>
        <div class="summary-box box-balance">
            <h4>คงเหลือ</h4>
            <p id="net-balance">฿0.00</p>
        </div>
        <div class="summary-box box-expense">
            <h4>รายจ่าย</h4>
            <p id="total-expense">฿0.00</p>
        </div>
    </div>
<!-- กรอกข้อมูล -->
    <form id="transaction-form">
        <input type="text" id="text" placeholder="ชื่อรายการ" required>
<!--หมวดหมู่ -->
        <select id="category" required>
            <option value="" disabled selected>เลือกหมวดหมู่</option>
            <option value="🍽️ อาหาร">🍽️ อาหาร</option>
            <option value="🚗 เดินทาง">🚗 เดินทาง</option>
            <option value="🛒 ช้อปปิ้ง">🛒 ช้อปปิ้ง</option>
            <option value="💰 เงินเดือน">💰 เงินเดือน</option>
            <option value="📦 อื่นๆ">📦 อื่นๆ</option>
        </select>
<!--เลือกรายรับรายจ่าย-->
        <select id="type" required>
            <option value="รายรับ">รายรับ</option>
            <option value="รายจ่าย">รายจ่าย</option>
        </select>
<!--ช่องกรอกจำนวนเงิน-->
        <input type="number" id="amount" placeholder="จำนวนเงิน(บาท)" min="1" step="0.01" required>
        <button type="submit" class="btn-add">เพิ่มรายการ</button>
    </form>
<!--ค้นหาประวัติ -->
    <div class="search-box">
        <input type="text" id="search" placeholder="🔍 ค้นหารายการ... (พิมพ์แล้วกรองทันที)">
    </div>
<!--แสดงประวัติรายการทั้งหมด -->
    <table>
        <thead>
            <tr>
                <th>ลำดับ</th>
                <th>ประเภท</th>
                <th>ชื่อรายการ</th>
                <th>หมวดหมู่</th>
                <th>จำนวนเงิน</th>
            </tr>
        </thead>
        <tbody id="transaction-list">
<!-- ข้อมูลจะถูกดึงมาแสดงที่นี่ผ่าน JavaScript -->
        </tbody>
    </table>
<!--ปุ่มล้างประวัติทั้งหมด-->
    <button id="btn-clear" class="btn-clear">🗑️ ล้างข้อมูลทั้งหมด</button>
</div>
<!--เชื่อมScript -->
<script src="script.js"></script>
</body>
</html>
