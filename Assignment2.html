<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>แปลงเงิน</title>
</head>
<body> 
    <div class="box">
        <h1>แปลงเงิน usd ↔ bath</h1>
        <h3><p id="time-text" style="color: black; font-size: 14px;"></p></h3> 
        <p id="rate-text">อัตราแลกเปลี่ยน: 1 usd = 33 bath</p>
<!--กรอก 2 ฝั่ง-->
        <label>ดอลลาร์ (usd):</label>
        <input type="number" id="input-usd" oninput="usdTobath()" onchange="saveToHistory()">
        <label>บาท (bath):</label>
        <input type="number" id="input-bath" oninput="bathTousd()" onchange="saveToHistory()">
<!--ปุ่มล้าง-->
        <button onclick="clearData()">Reset</button>  
        <hr>
<!--แสดงประวัติ-->
        <h3>ประวัติ 10 รายการล่าสุด</h3>
        <ul id="history-list"></ul>
        <button onclick="clearHistory()">Clear</button>
    </div>
    <script>
//ดึงเรทเงินโลกจากเว็บกลาง
        async function getRealRate() {
            try {
                let response = await fetch("https://api.exchangerate-api.com/v4/latest/USD");
                let data = await response.json();
                rate = data.rates.THB;
                document.getElementById("rate-text").innerHTML = "อัตราแลกเปลี่ยน: 1 usd = " + rate + " bath";
            } catch (error) {
                console.log(error);
            }
        }
        getRealRate();  
//ที่เก็บประวัติ
        let historyArray = []; 
//ดอลไปบาท
        function usdTobath() {
            let usd = document.getElementById("input-usd").value;
            let bath = usd * rate;
            document.getElementById("input-bath").value = bath;
        }
//บาทไปดอล
        function bathTousd() {
            let bath = document.getElementById("input-bath").value;
            let usd = bath / rate;
            document.getElementById("input-usd").value = usd;
        }
//เคลียประวัติ
        function clearData() {
            document.getElementById("input-usd").value = "";
            document.getElementById("input-bath").value = "";
        }
//ตัวบันทึกประวัติ
        function saveToHistory() {
            let usd = document.getElementById("input-usd").value;
            let bath = document.getElementById("input-bath").value;
//ถ้าช่องว่างไม่ต้องทำ
            if (usd == "" || bath == "") {
                return;
            }  
//ข้อความประวัติ
            let text = usd + " usd = " + bath + " bath"; 
//เอาที่แปลงเงินล่าสุดไปอยู่บนสุด
            historyArray.unshift(text);   
//เกิน 10 จะลบอันแรกที่กรอก
            if (historyArray.length > 10) {
                historyArray.pop();
            }    
//เรียกคำสั่งแสดงผลขึ้นหน้าจอ
            showHistory();
        }  
//แสดงประวัติหน้าเว็บ
        function showHistory() {
            let list = document.getElementById("history-list");
// ล้างของเก่าบนหน้าจอก่อน
            list.innerHTML = "";     
//เอาประวัติมาแสดงทีละบรรทัด
            for (let i = 0; i < historyArray.length; i++) {
                list.innerHTML += "<li>" + historyArray[i] + "</li>";
            }
        }    
//ฟังก์ชันล้างประวัติ
        function clearHistory() {
            historyArray = [];
            showHistory();
        }        
//เวลาปัจจุบัน
        function showTime() {
            let now = new Date();
            let h = now.getHours();
            let m = now.getMinutes();
            let s = now.getSeconds();
            let timeString = h + ":" + m + ":" + s;
//คือข้อความข้างหน้าของเวลา
            document.getElementById("time-text").innerHTML = "เวลาอัปเดต: " + timeString;
        }       
//เวลาเปิดเว็บ
        showTime();
    </script>
</body>
</html>
